[package]
name = "webchronicle"
version = "2.4.0"
edition = "2024"
description = "A web archiver that runs on your machine"
license = "AGPL-3.0-or-later"
authors = ["FreshJuice <contact@freshjuice.dev>", "Alex Zappa <alex@zoppa.dev>"]
repository = "https://github.com/freshjuice-dev/webchronicle"
homepage = "https://webchronicle.app"
keywords = ["web-archiver", "scraper", "offline", "archive", "snapshot"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "webchronicle"
path = "src/lib.rs"

[[bin]]
name = "webchronicle"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "2"
chrono = { version = "0.4", features = ["serde"] }
tiny_http = "0.12"
include_dir = "0.7"
tokio = { version = "1", features = ["full"] }
toml = "1"
url = "2"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true